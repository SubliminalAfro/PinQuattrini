<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  color-scheme: light;
  --bg:#F4F4F1; --card:#FFFFFF; --line:#E3E3DE; --line2:#EDEDE8; --text:#16171A; --muted:#5E616A;
  --accent:#0B7A55; --accent-ink:#075C40; --accent-soft:#E3F2EC; --btn:#0B7A55; --btn-ink:#FFFFFF;
  --field:#FFFFFF; --field-line:#D4D4CE; --seg:#E7E7E2; --seg-on:#FFFFFF; --track:#ECECE7;
  --p1:#2B3F99; --p2:#E9A23B; --p1-ink:#2B3F99; --p2-ink:#8A5A10;
  --warn-bg:#FDF1E3; --warn-line:#F3D2A8; --warn-ink:#7A2E0E; --danger:#B42318;
  --fab:#16171A; --fab-ink:#FFFFFF; --bar-off:#D9D9D3;
  --c-verde:#0B7A55; --c-blu:#2B3F99; --c-ambra:#B4690E; --c-rosso:#B42318; --c-viola:#7A3E9D; --c-grigio:#6B6E75;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#111214; --card:#1B1D21; --line:#2A2D33; --line2:#25282D; --text:#F2F2EF; --muted:#A3A6AD;
    --accent:#3DBE8B; --accent-ink:#7FE0B6; --accent-soft:#1F3A30; --btn:#0B7A55; --btn-ink:#FFFFFF;
    --field:#15171A; --field-line:#3A3D44; --seg:#25282D; --seg-on:#3A3D44; --track:#2A2D33;
    --p1:#7C8FE8; --p2:#E9A23B; --p1-ink:#9DACF0; --p2-ink:#F3C27A;
    --warn-bg:#2A1F12; --warn-line:#4A3518; --warn-ink:#F3C27A; --danger:#F27A6E;
    --fab:#F2F2EF; --fab-ink:#111214; --bar-off:#33363C;
    --c-verde:#3DBE8B; --c-blu:#8C9EF0; --c-ambra:#E9A23B; --c-rosso:#F27A6E; --c-viola:#C08AE0; --c-grigio:#A3A6AD;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#111214; --card:#1B1D21; --line:#2A2D33; --line2:#25282D; --text:#F2F2EF; --muted:#A3A6AD;
  --accent:#3DBE8B; --accent-ink:#7FE0B6; --accent-soft:#1F3A30; --btn:#0B7A55; --btn-ink:#FFFFFF;
  --field:#15171A; --field-line:#3A3D44; --seg:#25282D; --seg-on:#3A3D44; --track:#2A2D33;
  --p1:#7C8FE8; --p2:#E9A23B; --p1-ink:#9DACF0; --p2-ink:#F3C27A;
  --warn-bg:#2A1F12; --warn-line:#4A3518; --warn-ink:#F3C27A; --danger:#F27A6E;
  --fab:#F2F2EF; --fab-ink:#111214; --bar-off:#33363C;
  --c-verde:#3DBE8B; --c-blu:#8C9EF0; --c-ambra:#E9A23B; --c-rosso:#F27A6E; --c-viola:#C08AE0; --c-grigio:#A3A6AD;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:20px 20px 160px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
h2{margin:6px 0 0;font-size:17px;font-weight:800}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.pad{padding:16px}
.iconbtn{width:44px;height:44px;flex-shrink:0;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;padding:0}
.ghost{border:0;background:transparent}
.btn{height:54px;border:0;border-radius:14px;background:var(--btn);color:var(--btn-ink);font-size:17px;font-weight:700;width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn.dark{background:var(--fab);color:var(--fab-ink);font-size:16px}
.btn.soft{background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent);height:50px;font-size:15px}
.btn.dashed{background:var(--accent-soft);color:var(--accent-ink);border:1px dashed var(--accent);height:50px;font-size:15px}
.btn.plain{background:var(--card);color:var(--text);border:1px solid var(--line);height:48px;font-size:14px}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);height:48px;font-size:15px}
.btn.danger-solid{background:var(--danger);color:var(--fab-ink)}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;padding:10px 0}
label.lbl,.lbl{font-size:13px;font-weight:600;display:block}
.field{display:flex;flex-direction:column;gap:6px}
input.in,select.in{height:48px;border-radius:12px;border:1px solid var(--field-line);background:var(--field);padding:0 14px;font-size:16px;width:100%;min-width:0}
.amount{display:block;width:100%;border:0;background:transparent;text-align:center;font-size:44px;font-weight:800;letter-spacing:-.02em;padding:0}
.amount::placeholder{color:var(--muted);opacity:.6}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:42px;padding:0 14px;border-radius:21px;border:1px solid var(--field-line);background:var(--card);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip.on{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.chip.sm{height:36px;padding:0 12px;font-size:13px;border-radius:18px}
.chip.sm.on{border:2px solid var(--text);background:var(--card);color:var(--text)}
.chip.add{border:1px dashed var(--muted);background:transparent}
.subbox{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--seg);border-radius:14px;padding:8px 10px}
.seg{display:grid;gap:4px;background:var(--seg);padding:4px;border-radius:14px}
.seg button{height:42px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-size:15px;font-weight:600}
.seg button.on{background:var(--seg-on);color:var(--text);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.switchrow{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 16px;min-height:56px}
.switchrow input{width:44px;height:28px;accent-color:var(--accent)}
.tile{width:40px;height:40px;flex-shrink:0;border-radius:12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 15%,var(--card))}
.tile svg{stroke:var(--c)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line2);background:transparent;text-align:left;width:100%;min-height:64px}
.item:last-child{border-bottom:0}
.item .t{font-size:15px;font-weight:700}
.item .s{font-size:12px;color:var(--muted)}
.item .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .grow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .amt{font-size:15px;font-weight:700;white-space:nowrap}
.hero{background:var(--btn);color:#fff;border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.hero .big{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.alert{display:flex;align-items:center;gap:10px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;text-align:left;width:100%}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar>div{height:100%;border-radius:4px}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:var(--track)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex-shrink:0}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:15px;line-height:1.5}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.tabs button{height:64px;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600}
nav.tabs button.on{color:var(--accent);font-weight:700}
.fab{position:fixed;right:max(20px,calc(50% - 240px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:20px;border:0;background:var(--fab);color:var(--fab-ink);display:flex;align-items:center;justify-content:center;z-index:21;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out}
.sheet .wrap{padding-bottom:32px;min-height:100%}

ranslate(140 6) scale(0.1) rotate(14 256 256)%22/%3E%3Cuse href=%22%23p%22 transform=%22translate(22 150) scale(0.1) rotate(-6 256 256)%22/%3E%3C/g%3E%3C/svg%3E")}}

6)%22/%3E%3Cuse href=%22%23p%22 transform=%22translate(22 150) scale(0.1) rotate(-6 256 256)%22/%3E%3C/g%3E%3C/svg%3E")}
.sheet{background-image:none}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
details .chev{transition:transform .2s}
details[open]>summary .chev{transform:rotate(90deg)}
.brand{display:inline-flex;align-items:center;gap:7px;color:var(--accent);flex-shrink:0;line-height:1;white-space:nowrap}
.brand .wm{font-size:16px;font-weight:500;letter-spacing:-.035em}
.brand .wm b{font-weight:800}
.brand.top{align-self:flex-start}
#app>.wrap{min-height:100vh;min-height:100dvh}
.foot-logo{display:flex;color:var(--accent);opacity:.9}
.foot{margin-top:auto;padding-top:28px;display:flex;flex-direction:column;align-items:center;gap:8px}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.err{color:var(--danger);font-size:14px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--fab);color:var(--fab-ink);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:60;max-width:90vw;text-align:center}
.icongrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.icongrid button{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;padding:0}
.icongrid button.on{border:2px solid var(--accent);background:var(--accent-soft)}
.icongrid button.on svg{stroke:var(--accent)}
.swatches{display:flex;justify-content:space-between;gap:6px}
.swatches button{width:44px;height:44px;border-radius:50%;border:0;padding:0}
.swatches button.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--text)}
.tablerow{display:grid;grid-template-columns:1fr auto auto;gap:16px;padding:14px 0;border-bottom:1px solid var(--line2);font-size:15px;align-items:center}
.tablerow:last-child{border-bottom:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
textarea.in{width:100%;min-height:180px;border-radius:12px;border:1px solid var(--field-line);background:var(--field);padding:12px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.daygroup{font-size:13px;font-weight:700;color:var(--muted);margin:8px 4px 0}

<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module">

const THKEY='pinquattrini:theme';
const ORIG_THEME=document.documentElement.getAttribute('data-theme');
let theme=(()=>{try{return localStorage.getItem(THKEY)||'auto'}catch(e){return'auto'}})();
function applyTheme(){
  const r=document.documentElement;
  if(theme==='auto'){ORIG_THEME?r.setAttribute('data-theme',ORIG_THEME):r.removeAttribute('data-theme')}
  else r.setAttribute('data-theme',theme);
  const dark=theme==='dark'||(theme==='auto'&&(ORIG_THEME?ORIG_THEME==='dark':!!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)));
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=dark?'#111214':'#F4F4F1';
}

/* ============ Sincronizzazione ============
   Dopo ogni modifica, save() confronta i dati in memoria con l'ultima
   versione ricevuta dal database e scrive solo cio che e cambiato. */
const COLLS=['categories','expenses','recurring','settlements'];
const ROOT=['spaces','main'];
let synced={categories:{},expenses:{},recurring:{},settlements:{}},syncedMeta=null;
let loaded={meta:false,categories:false,expenses:false,recurring:false,settlements:false};
let unsubs=[],recurDone=false;
function stable(v){if(Array.isArray(v))return'['+v.map(stable).join(',')+']';if(v&&typeof v==='object')return'{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}';return JSON.stringify(v===undefined?null:v)}
const clean=o=>JSON.parse(JSON.stringify(o));
const metaOf=()=>({people:S.people,settings:S.settings,setupDone:!!S.setupDone});
const allLoaded=()=>Object.values(loaded).every(Boolean);
function save(){
  if(authState!=='in'||!allLoaded())return;
  const ops=[];
  for(const c of COLLS){
    const cur={};for(const it of S[c])cur[it.id]=it;
    for(const id in cur){const j=stable(cur[id]);if(synced[c][id]!==j){ops.push(['set',doc(db,...ROOT,c,id),clean(cur[id])]);synced[c][id]=j}}
    for(const id in synced[c])if(!cur[id]){ops.push(['del',doc(db,...ROOT,c,id)]);delete synced[c][id]}
  }
  const mj=stable(metaOf());if(mj!==syncedMeta){ops.push(['set',doc(db,...ROOT),clean(metaOf())]);syncedMeta=mj}
  for(let i=0;i<ops.length;i+=400){
    const b=writeBatch(db);
    for(const[t,r,v]of ops.slice(i,i+400))t==='set'?b.set(r,v):b.delete(r);
    b.commit().catch(e=>{console.error(e);toast('Salvataggio non riuscito ('+(e.code||'errore')+'). Riprova.')});
  }
}
function stopListeners(){unsubs.forEach(u=>u());unsubs=[];synced={categories:{},expenses:{},recurring:{},settlements:{}};syncedMeta=null;loaded={meta:false,categories:false,expenses:false,recurring:false,settlements:false};recurDone=false}
function onData(){
  if(!allLoaded()){render(true);return}
  if(!recurDone){recurDone=true;runRecurring()}
  render(true);
}
function listenErr(e){console.error(e);dataError=e.code==='permission-denied'?'Il database non ti fa entrare. Controlla le regole di Firestore.':'Non riesco a leggere i dati ('+(e.code||'errore')+').';render()}
function startListeners(){
  stopListeners();
  unsubs.push(onSnapshot(doc(db,...ROOT),snap=>{
    if(snap.exists()){const d=snap.data();S.people=d.people||DEFAULT_PEOPLE;S.settings=Object.assign({alertOn:true,alertAt:80},d.settings||{});S.setupDone=!!d.setupDone;syncedMeta=stable(metaOf());loaded.meta=true;onData()}
    else if(!snap.metadata.fromCache){S.people=JSON.parse(JSON.stringify(DEFAULT_PEOPLE));S.settings={alertOn:true,alertAt:80};S.setupDone=false;loaded.meta=true;save();onData()}
  },listenErr));
  for(const c of COLLS){
    unsubs.push(onSnapshot(collection(db,...ROOT,c),snap=>{
      S[c]=snap.docs.map(d=>({...d.data(),id:d.id}));
      synced[c]={};for(const it of S[c])synced[c][it.id]=stable(it);
      loaded[c]=true;onData();
    },listenErr));
  }
}

});

function addMonth(m,n){let[y,mm]=m.split('-').map(Number);mm+=n;while(mm>12){mm-=12;y++}while(mm<1){mm+=12;y--}return y+'-'+pad(mm)}

function share(e,p){if(e.split==='half')return p==='p1'?Math.ceil(e.amount/2):Math.floor(e.amount/2);return e.split===p?e.amount:0}
function net(p){let n=0;for(const e of S.expenses){if(e.payer===p)n+=e.amount;n-=share(e,p)}for(const s of S.settlements){if(s.from===p)n+=s.amount;if(s.to===p)n-=s.amount}return n}
const inMonth=m=>S.expenses.filter(e=>e.date.slice(0,7)===m);
const sum=a=>a.reduce((t,e)=>t+e.amount,0);
function sortExp(a){return a.slice().sort((x,y)=>y.date.localeCompare(x.date)||y.createdAt-x.createdAt)}
function splitLabel(e){if(e.split==='half')return'50/50';return e.split===me?'tutta tua':'tutta di '+pname(e.split)}
function lastSettle(){return S.settlements.filter(s=>s.type!=='rimborso').sort((a,b)=>b.createdAt-a.createdAt)[0]}
function sDate(s){return new Date(s.date?s.date+'T12:00:00':s.createdAt).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}
function balText(n,fut){const o=esc(pname(other(me)));if(n>0)return`${o} ${fut?'ti dovrà':'ti deve'} ${fmt(n)}`;if(n<0)return`${fut?'Dovrai':'Devi'} ${fmt(-n)} a ${o}`;return fut?'Sarete pari':'Siete pari'}
function rimbAfter(){const f=ui.form;const a=parseMoney(f.amount);const n=net(me)+(f.dir==='in'?-a:a);return`Dopo il rimborso: <b>${balText(n,true)}</b>`}
function runRecurring(){
  const cm=curMonth(),td=new Date().getDate();let added=0;
  for(const r of S.recurring){
    if(!r.active)continue;
    let m=r.startMonth;let guard=0;
    while(m<=cm&&guard++<120){
      if(!r.done.includes(m)){
        const d=Math.min(r.day,daysIn(m));
        if(m<cm||td>=d){
          const eid=r.id+'_'+m;
          if(!S.expenses.some(x=>x.id===eid))S.expenses.push({id:eid,amount:r.amount,desc:r.desc,date:m+'-'+pad(d),cat:r.cat,sub:r.sub,payer:r.payer,split:r.split,recId:r.id,createdAt:Date.now()});
          r.done.push(m);added++;
        }
      }
      m=addMonth(m,1);
    }
  }
  if(added)save();
  return added;
}

    </div>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px">${rows.length?rows.slice(0,4).map(r=>`<div><span class="row small" style="gap:6px;font-weight:600"><span class="dot" style="background:var(--c-${r.c.color})"></span>${esc(r.c.name)}</span><span style="font-size:15px;font-weight:800;padding-left:16px">${fmt(r.a)}</span></div>`).join('')+(rows.length>4?`<span class="muted small">e altre ${rows.length-4}</span>`:''):`<span class="muted">Nessuna spesa in questo mese.</span>`}</div>
  </div>
  ${rows.length?`<div class="card list">${rows.map(r=>{
    const open=ui.open===r.id;const pct=Math.round(r.a/tot*100);

    if(open){const bs={};for(const e of ex.filter(e=>e.cat===r.id)){const k=e.sub||'';bs[k]=(bs[k]||0)+e.amount}
      subs=Object.entries(bs).sort((a,b)=>b[1]-a[1]).map(([k,a])=>`<div class="between small" style="padding:8px 14px 8px 66px;border-bottom:1px solid var(--line2)"><span>${esc(k?(subOf(r.c,k)||{name:'Altro'}).name:'Senza sottocategoria')}</span><span style="font-weight:700">${fmt(a)}</span></div>`).join('')}
    return`<button class="item" data-act="openCat" data-id="${r.id}" aria-expanded="${open}">${tile(r.c)}<span class="grow"><span class="t">${esc(r.c.name)}</span><span class="s">${pct}% del mese · tocca per ${open?'chiudere':'il dettaglio'}</span></span><span class="amt">${fmt(r.a)}</span></button>${subs}`}).join('')}</div>`:''}
  <div class="card pad" style="display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:700">Spesa totale degli ultimi 6 mesi</span><span class="muted small">Quanto avete speso in tutto ogni mese</span></div>
    <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;height:150px">${months.map(x=>{const cur=x.m===ui.month;return`<div style="display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0"><span style="font-size:11px;white-space:nowrap;${cur?'font-weight:800':'color:var(--muted);font-weight:600'}">${x.t?fmtShort(x.t):'\u2013'}</span><span style="width:100%;height:${x.t?Math.max(6,Math.round(x.t/max*96)):3}px;border-radius:6px;background:${cur?'var(--accent)':'var(--bar-off)'}"></span><span style="font-size:12px;${cur?'font-weight:700':'color:var(--muted)'}">${monthName(x.m).slice(0,3).toLowerCase()}</span></div>`}).join('')}</div>

/* ============ Render ============ */
function render(remote){
  const app=document.getElementById('app');
  const hadSheet=!!ui.sheet;
  let html='',tabs=false;
  if(authState==='loading')html=vLoading();
  else if(authState==='out')html=vLogin();
  else if(authState==='denied')html=withFoot(vDenied());
  else if(dataError||!allLoaded())html=vLoading();
  else if(!S.setupDone)html=withFoot(vCategorie(true));
  else{
    if(!newsChecked&&!ui.sheet){newsChecked=true;const l=newsToShow();if(l.length){ui.sheet='news';ui.form={list:l}}}
    const V={home:vHome,spese:vSpese,riepilogo:vRiepilogo,budget:vBudget,ricorrenti:vRicorrenti,saldo:vSaldo,categorie:()=>vCategorie(false),impostazioni:vImpostazioni};
    html=withFoot((V[ui.view]||vHome)());
    tabs=true;
  }
  if(tabs){
    const T=[['home','Home',UI.home],['riepilogo','Riepilogo',UI.chart],['ricorrenti','Ricorrenti',UI.rec],['saldo','Saldo',UI.scale],['impostazioni','Opzioni',UI.gear]];
    const act={spese:'home',budget:'impostazioni',categorie:'impostazioni'}[ui.view]||ui.view;
    html+=`<button class="fab" data-act="newExp" aria-label="Aggiungi spesa">${svg(UI.plus,26,2.5)}</button>`;
    html+=`<nav class="tabs" aria-label="Sezioni"><div class="in">${T.map(([k,l,i])=>`<button class="${act===k?'on':''}" data-act="go" data-v="${k}" ${act===k?'aria-current="page"':''}>${svg(i,22)}${l}</button>`).join('')}</div></nav>`;
  }
  app.innerHTML=html;
  if(!(remote&&hadSheet))renderSheet();
}
function renderSheet(keepFocus){
  const el=document.getElementById('sheet');
  const fid=keepFocus&&document.activeElement&&document.activeElement.id;
  const sc=el.firstElementChild?el.firstElementChild.scrollTop:0;
  const S2={exp:sheetExp,rec:sheetRec,cat:sheetCat,backup:sheetBackup,news:sheetNews,rimb:sheetRimb,wipe:sheetWipe}[ui.sheet];
  el.innerHTML=S2?S2():'';
  document.body.style.overflow=S2?'hidden':'';
  if(el.firstElementChild)el.firstElementChild.scrollTop=sc;
  if(fid){const f=document.getElementById(fid);if(f)f.focus()}
}

/* ============ Azioni ============ */
function openExp(e){
  const first=S.categories[0];
  ui.form=e?{id:e.id,amount:moneyInput(e.amount),desc:e.desc,date:e.date,cat:e.cat,sub:e.sub||'',payer:e.payer,split:e.split,recId:e.recId}
    :{amount:'',desc:'',date:todayISO(),cat:first?first.id:'',sub:'',payer:me,split:'half',repeat:false};
  ui.sheet='exp';ui.err='';ui.confirm='';renderSheet();
  if(!e)setTimeout(()=>{const a=document.getElementById('fa');if(a)a.focus()},60);
}
function openRec(r){
  const first=S.categories[0];
  ui.form=r?{id:r.id,amount:moneyInput(r.amount),desc:r.desc,day:r.day,cat:r.cat,sub:r.sub||'',payer:r.payer,split:r.split}
    :{amount:'',desc:'',day:1,cat:first?first.id:'',sub:'',payer:me,split:'half'};
  ui.sheet='rec';ui.err='';ui.confirm='';renderSheet();
}
let catReturn=null;
function openCat(c,ret){
  catReturn=ret?{sheet:ui.sheet,form:ui.form}:null;
  ui.form=c?{id:c.id,name:c.name,icon:c.icon,color:c.color,subs:c.subs.map(s=>({...s})),newSub:''}:{name:'',icon:'Carrello',color:'verde',subs:[],newSub:''};
  ui.sheet='cat';ui.err='';ui.confirm='';renderSheet();
}
function closeCat(newId){
  if(catReturn){ui.sheet=catReturn.sheet;ui.form=catReturn.form;if(newId){ui.form.cat=newId;ui.form.sub=''}catReturn=null}
  else{ui.sheet=null;ui.form=null}
  ui.err='';ui.confirm='';render();
}
function needConfirm(key){if(ui.confirm===key){ui.confirm='';return false}ui.confirm=key;return true}
function validMoney(f){const a=parseMoney(f.amount);if(a<=0){ui.err='Scrivi un importo maggiore di zero.';return 0}if(a>100000000){ui.err='Importo troppo alto.';return 0}return a}

const ACT={
  go(d){ui.view=d.v;ui.confirm='';if(d.v==='home')ui.filter='';render();window.scrollTo(0,0)},
  month(d){const m=addMonth(ui.month,Number(d.n));if(m<=curMonth()){ui.month=m;ui.open='';render()}},
  filter(d){ui.filter=d.id;render()},
  openCat(d){ui.open=ui.open===d.id?'':d.id;render()},
  newExp(){if(!S.categories.length){toast('Crea prima almeno una categoria.');return}openExp(null)},
  editExp(d){const e=S.expenses.find(x=>x.id===d.id);if(e)openExp(e)},
  fCat(d){ui.form.cat=d.id;ui.form.sub='';renderSheet()},
  fSub(d){ui.form.sub=ui.form.sub===d.id?'':d.id;renderSheet()},
  fPayer(d){ui.form.payer=d.p;renderSheet()},
  fSplit(d){ui.form.split=d.s;renderSheet()},
  close(){ui.sheet=null;ui.form=null;ui.err='';ui.confirm='';render()},
  saveExp(){
    const f=ui.form;ui.err='';const a=validMoney(f);
    if(a&&!f.cat)ui.err='Scegli una categoria.';
    if(a&&!/^\d{4}-\d{2}-\d{2}$/.test(f.date||''))ui.err='Scegli una data.';
    if(ui.err){renderSheet();return}
    const data={amount:a,desc:(f.desc||'').trim(),date:f.date,cat:f.cat,sub:f.sub||'',payer:f.payer,split:f.split};
    if(f.id){Object.assign(S.expenses.find(x=>x.id===f.id),data)}
    else{
      const e={id:uid(),...data,createdAt:Date.now()};
      if(f.repeat){const r={id:uid(),amount:a,desc:data.desc,cat:data.cat,sub:data.sub,payer:data.payer,split:data.split,day:Number(f.date.slice(8)),active:true,startMonth:f.date.slice(0,7),done:[f.date.slice(0,7)]};S.recurring.push(r);e.recId=r.id}
      S.expenses.push(e);
    }
    save();ui.sheet=null;ui.form=null;render();toast(f.id?'Spesa aggiornata':'Spesa salvata');
  },
  delExp(){if(needConfirm('delExp')){renderSheet();return}S.expenses=S.expenses.filter(x=>x.id!==ui.form.id);save();ui.sheet=null;ui.form=null;render();toast('Spesa eliminata')},
  newRec(){if(!S.categories.length){toast('Crea prima almeno una categoria.');return}openRec(null)},
  editRec(d){const r=S.recurring.find(x=>x.id===d.id);if(r)openRec(r)},
  saveRec(){
    const f=ui.form;ui.err='';const a=validMoney(f);const day=Math.round(Number(f.day));
    if(a&&!(day>=1&&day<=31))ui.err='Il giorno deve essere tra 1 e 31.';
    if(a&&!f.cat)ui.err='Scegli una categoria.';
    if(ui.err){renderSheet();return}
    const data={amount:a,desc:(f.desc||'').trim(),day,cat:f.cat,sub:f.sub||'',payer:f.payer,split:f.split};
    if(f.id)Object.assign(S.recurring.find(x=>x.id===f.id),data);
    else S.recurring.push({id:uid(),...data,active:true,startMonth:curMonth(),done:[]});
    const n=runRecurring();save();ui.sheet=null;ui.form=null;render();
    toast(n?'Salvata e aggiunta a questo mese':'Spesa ricorrente salvata');
  },
  delRec(){if(needConfirm('delRec')){renderSheet();return}S.recurring=S.recurring.filter(x=>x.id!==ui.form.id);save();ui.sheet=null;ui.form=null;render();toast('Ricorrente eliminata')},
  newCat(d){openCat(null,d&&d.ret==='1')},
  editCat(d){const c=S.categories.find(x=>x.id===d.id);if(c)openCat(c,false)},
  closeCat(){closeCat(null)},
  cIcon(d){ui.form.icon=d.k;renderSheet()},
  cColor(d){ui.form.color=d.k;renderSheet()},
  cAddSub(){const f=ui.form;const n=(f.newSub||'').trim();if(!n)return;if(f.subs.some(s=>s.name.toLowerCase()===n.toLowerCase())){ui.err='Questa sottocategoria c’è già.';renderSheet();return}f.subs.push({id:uid(),name:n});f.newSub='';ui.err='';renderSheet();const i=document.getElementById('cs');if(i)i.focus()},
  cDelSub(d){ui.form.subs=ui.form.subs.filter(s=>s.id!==d.id);renderSheet()},
  saveCat(){
    const f=ui.form;const n=(f.name||'').trim();ui.err='';
    if(!n)ui.err='Dai un nome alla categoria.';
    else if(S.categories.some(c=>c.id!==f.id&&c.name.toLowerCase()===n.toLowerCase()))ui.err='Esiste già una categoria con questo nome.';
    if(ui.err){renderSheet();return}
    if((f.newSub||'').trim()){const ns=f.newSub.trim();if(!f.subs.some(s=>s.name.toLowerCase()===ns.toLowerCase()))f.subs.push({id:uid(),name:ns})}
    let id=f.id;
    if(id)Object.assign(S.categories.find(c=>c.id===id),{name:n,icon:f.icon,color:f.color,subs:f.subs});
    else{id=uid();S.categories.push({id,name:n,icon:f.icon,color:f.color,subs:f.subs,budget:0})}
    save();toast('Categoria salvata');closeCat(f.id?null:id);
  },
  delCat(){
    const f=ui.form;const used=S.expenses.filter(e=>e.cat===f.id).length;
    if(ui.confirm!=='delCat'){ui.confirm='delCat';ui.err=used?`È usata da ${used} ${used===1?'spesa':'spese'}: resteranno come “Senza categoria”.`:'';renderSheet();return}
    S.categories=S.categories.filter(c=>c.id!==f.id);save();toast('Categoria eliminata');closeCat(null);
  },
  settle(){
    const n=net(me);if(!n)return;
    if(needConfirm('settle')){render();return}
    const o=other(me);
    S.settlements.push(n>0?{id:uid(),type:'pareggio',from:o,to:me,amount:n,date:todayISO(),createdAt:Date.now()}:{id:uid(),type:'pareggio',from:me,to:o,amount:-n,date:todayISO(),createdAt:Date.now()});
    save();render();toast('Pareggio registrato: siete pari');
  },
  delSettle(d){if(needConfirm('ds'+d.id)){toast('Tocca di nuovo per annullare il pareggio');return}S.settlements=S.settlements.filter(s=>s.id!==d.id);save();render();toast('Pareggio annullato')},
  setTheme(d){theme=d.t;try{localStorage.setItem(THKEY,theme)}catch(e){}applyTheme();render()},
  newRimb(){const n=net(me);ui.form={dir:n<0?'out':'in',amount:moneyInput(Math.abs(n)),date:todayISO(),note:''};ui.sheet='rimb';ui.err='';ui.confirm='';renderSheet()},
  rDir(d){ui.form.dir=d.d;renderSheet()},
  saveRimb(){
    const f=ui.form;ui.err='';const a=validMoney(f);
    if(a&&!/^\d{4}-\d{2}-\d{2}$/.test(f.date||''))ui.err='Scegli una data.';
    if(ui.err){renderSheet();return}
    const o=other(me);
    S.settlements.push({id:uid(),type:'rimborso',from:f.dir==='in'?o:me,to:f.dir==='in'?me:o,amount:a,date:f.date,note:(f.note||'').trim(),createdAt:Date.now()});
    save();ui.sheet=null;ui.form=null;render();toast('Rimborso registrato');
  },
  closeNews(){setSeen();ui.sheet=null;ui.form=null;render()},
  finishSetup(){if(!S.categories.length)return;S.setupDone=true;setSeen();newsChecked=true;save();ui.view='home';render()},
  saveNames(){const v=document.getElementById('n1').value.trim();if(!v){toast('Il nome non pu\u00f2 essere vuoto.');return}S.people[me].name=v;save();render();toast('Nome salvato')},
  backup(){ui.form={mode:'out',text:JSON.stringify(S)};ui.sheet='backup';ui.err='';renderSheet()},
  restore(){ui.form={mode:'in',text:''};ui.sheet='backup';ui.err='';renderSheet()},
  copyBk(){const t=document.getElementById('bk');t.focus();t.select();let ok=false;
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).then(()=>toast('Copiato'),()=>{try{ok=document.execCommand('copy')}catch(e){}toast(ok?'Copiato':'Testo selezionato: copialo a mano')})}
    else{try{ok=document.execCommand('copy')}catch(e){}toast(ok?'Copiato':'Testo selezionato: copialo a mano')}},
  doRestore(){
    try{const d=JSON.parse(ui.form.text||'');if(!d||!Array.isArray(d.expenses)||!Array.isArray(d.categories))throw 0;
      for(const c of COLLS)S[c]=Array.isArray(d[c])?d[c]:[];
      if(d.settings)S.settings=Object.assign({alertOn:true,alertAt:80},d.settings);
      S.setupDone=true;runRecurring();save();ui.sheet=null;ui.form=null;ui.view='home';render();toast('Dati importati')}
    catch(e){ui.err='Questo testo non è una copia di PinQuattrini valida.';renderSheet()}
  },
  reset(){ui.form={pw:''};ui.sheet='wipe';ui.err='';ui.busy=false;renderSheet();setTimeout(()=>{const i=document.getElementById('wp');if(i)i.focus()},60)},
  wipeCancel(){ui.sheet=null;ui.form=null;ui.err='';ui.busy=false;render()},
  wipeGo(){
    const f=ui.form||{};
    if(ui.busy)return;
    if(!f.pw){ui.err='Scrivi la password.';renderSheet(true);return}
    const u=auth.currentUser;
    if(!u){ui.err='Sessione scaduta: esci e rientra, poi riprova.';renderSheet(true);return}
    ui.err='';ui.busy=true;renderSheet(true);
    reauthenticateWithCredential(u,EmailAuthProvider.credential(userEmail,f.pw)).then(()=>{
      ui.busy=false;ui.sheet=null;ui.form=null;
      for(const c of COLLS)S[c]=[];S.setupDone=false;save();ui.view='home';render();toast('Tutti i dati sono stati cancellati');
    }).catch(e=>{
      ui.busy=false;
      ui.err=(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password')?'Password non corretta.':e.code==='auth/too-many-requests'?'Troppi tentativi. Aspetta qualche minuto e riprova.':e.code==='auth/network-request-failed'?'Nessuna connessione. Controlla la rete e riprova.':e.code==='auth/missing-password'?'Scrivi la password.':'Verifica non riuscita ('+(e.code||'errore')+').';
      renderSheet(true);
    });
  },
  login(){
    const f=ui.form||{};const em=(f.email||'').trim();
    if(!em||!f.pw){ui.err='Scrivi email e password.';render();return}
    ui.err='';ui.busy=true;render();
    signInWithEmailAndPassword(auth,em,f.pw).then(()=>{ui.busy=false}).catch(e=>{ui.busy=false;ui.err=AUTH_ERR[e.code]||('Accesso non riuscito ('+e.code+').');render()});
  },
  forgot(){
    const em=((ui.form||{}).email||'').trim();
    if(!em){ui.err='Scrivi prima la tua email, poi tocca di nuovo \u201cPassword dimenticata?\u201d.';render();return}
    sendPasswordResetEmail(auth,em).then(()=>{ui.err='';render();toast('Se l\u2019email \u00e8 giusta, ti arriva un messaggio per cambiare password. Controlla anche lo spam.')}).catch(e=>{ui.err=AUTH_ERR[e.code]||'Invio non riuscito.';render()});
  },
  logout(){signOut(auth).catch(()=>{});ui.view='home'}
};

document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');if(!t||t.disabled)return;
  const a=t.dataset.act;
  const key=a==='delSettle'?'ds'+t.dataset.id:a;
  if(ui.confirm&&ui.confirm!==key){ui.confirm='';if(a!=='delCat')ui.err=''}
  ACT[a]&&ACT[a](t.dataset,t);
});
document.addEventListener('input',ev=>{
  const t=ev.target;const k=t.dataset&&t.dataset.f;if(!k)return;
  if(!ui.form)ui.form={};
  ui.form[k]=t.type==='checkbox'?t.checked:t.value;
  if(ui.sheet==='rimb'){const af=document.getElementById('after');if(af)af.innerHTML=rimbAfter()}
  if(k==='amount'&&(ui.sheet==='exp'||ui.sheet==='rec')){const sh=document.getElementById('shares');if(sh){const tmp=document.createElement('div');tmp.innerHTML=payerSplit(ui.form);const n=tmp.querySelector('#shares');if(n)sh.innerHTML=n.innerHTML}}
});
document.addEventListener('toggle',ev=>{const t=ev.target;if(t.dataset&&t.dataset.det)ui.det[t.dataset.det]=t.open},true);
document.addEventListener('keydown',ev=>{
  const t=ev.target;
  if(ev.key==='Enter'&&t.dataset&&t.dataset.enter){ev.preventDefault();ACT[t.dataset.enter]()}
  if(ev.key==='Escape'&&ui.sheet){ui.sheet==='cat'?closeCat(null):ui.sheet==='news'?ACT.closeNews():ACT.close()}
});
document.addEventListener('change',ev=>{
  const t=ev.target;const k=t.dataset&&t.dataset.chg;if(!k)return;
  if(k==='budget'){const c=S.categories.find(x=>x.id===t.dataset.id);if(c){c.budget=parseMoney(t.value);save();render();toast(c.budget?'Budget di '+c.name+' salvato':'Budget di '+c.name+' tolto')}}
  if(k==='alertOn'){S.settings.alertOn=t.checked;save();render()}
  if(k==='alertAt'){S.settings.alertAt=Number(t.value);save();render()}
  if(k==='recActive'){const r=S.recurring.find(x=>x.id===t.dataset.id);if(r){r.active=t.checked;if(r.active){if(r.startMonth<curMonth()&&!r.done.includes(curMonth())){/* riattivata: non recupera i mesi saltati */for(let m=r.startMonth;m<curMonth();m=addMonth(m,1))if(!r.done.includes(m))r.done.push(m)}runRecurring()}save();render();toast(r.active?'Ricorrente attiva':'Ricorrente in pausa')}}
});
render();
</script>
